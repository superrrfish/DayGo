<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DayGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2235;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f1f5f9;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --upcoming: #3b82f6;
      --active: #10b981;
      --card-w: 280px;
      --radius: 14px;
      --transition: 0.22s cubic-bezier(.4, 0, .2, 1);
      --topbar-h: 56px;
    }

    [data-theme="light"] {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface2: #e8edf3;
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-muted: #94a3b8;
      --accent-glow: rgba(59, 130, 246, 0.1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
    }

    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    #logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    #logo span {
      color: var(--accent);
    }

    #weather-widget {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    #weather-widget .emoji {
      font-size: 20px;
    }

    #weather-temp {
      font-size: 16px;
      font-weight: 600;
    }

    #main {
      position: fixed;
      top: var(--topbar-h);
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: row;
    }

    #event-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 0 28px 28px;
      min-width: 0;
      overflow: hidden;
    }

    #leave-by {
      margin-bottom: 24px;
      padding-right: 28px;
      flex-shrink: 0;
    }

    #leave-by .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    #leave-by .time {
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
      letter-spacing: -2px;
    }

    #leave-by .event-name {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #leave-by.hidden {
      display: none;
    }

    #ribbon-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-right: 28px;
      flex-shrink: 0;
    }

    #ribbon {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      overflow-y: visible;
      padding-bottom: 16px;
      padding-right: 28px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
    }

    #ribbon::-webkit-scrollbar {
      height: 4px;
    }

    #ribbon::-webkit-scrollbar-track {
      background: transparent;
    }

    #ribbon::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .event-card {
      flex: 0 0 var(--card-w);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      scroll-snap-align: start;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }

    .event-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .event-card:hover .card-actions {
      opacity: 1;
    }

    .event-card.active-card .card-status {
      color: #10b981 !important;
    }

    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .card-status {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-time {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 12px;
    }

    .card-divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 12px;
    }

    .card-location {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.4;
      text-decoration: none;
      transition: color var(--transition);
    }

    .card-location:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .card-location svg {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .card-description {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-mode {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .card-dot {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--surface);
    }

    .card-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .card-action-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .card-action-btn:hover {
      background: var(--surface);
      color: var(--text);
      border-color: var(--accent);
    }

    .card-action-btn.delete:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    #empty-state {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      height: 160px;
      color: var(--text-muted);
    }

    #empty-state .big {
      font-size: 32px;
      margin-bottom: 8px;
    }

    #empty-state p {
      font-size: 14px;
    }

    #archive-btn {
      position: fixed;
      left: 24px;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px) + 56px);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: color var(--transition), background var(--transition);
    }

    #archive-btn:hover {
      color: var(--text);
      background: var(--surface2);
    }

    #resize-handle {
      width: 6px;
      flex-shrink: 0;
      background: transparent;
      cursor: col-resize;
      position: relative;
    }

    #resize-handle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 40px;
      background: var(--border);
      border-radius: 2px;
      transition: background var(--transition), height var(--transition);
    }

    #resize-handle:hover::after,
    #resize-handle.dragging::after {
      background: var(--accent);
      height: 60px;
    }

    #map-panel {
      width: 320px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 200px;
      max-width: 60vw;
    }

    #map-label {
      padding: 16px 20px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #map {
      flex: 1;
    }

    .mapboxgl-ctrl-bottom-left,
    .mapboxgl-ctrl-bottom-right {
      display: none;
    }

    #theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: background var(--transition), transform var(--transition);
    }

    #theme-toggle:hover {
      transform: scale(1.08);
    }

    #create-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 200;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 30px;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    #create-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(59, 130, 246, 0.5);
    }

    #modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    #modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      width: 440px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(16px);
      transition: transform var(--transition);
    }

    #modal-overlay.open #modal {
      transform: translateY(0);
    }

    #modal h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color var(--transition);
    }

    .field textarea {
      resize: vertical;
      min-height: 64px;
      line-height: 1.4;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
    }

    .field select option {
      background: var(--surface);
    }

    .field-row {
      display: flex;
      gap: 12px;
    }

    .field-row .field {
      flex: 1;
    }

    #autocomplete-results {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 4px;
      overflow: hidden;
      max-height: 180px;
      overflow-y: auto;
    }

    .autocomplete-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover {
      background: var(--surface2);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-primary {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity var(--transition);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }

    #archive-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    #archive-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    #archive-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 400;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      max-height: 60vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform var(--transition);
      width: 100%;
    }

    #archive-overlay.open+#archive-drawer {
      transform: translateY(0);
    }

    #archive-drawer h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .archive-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .archive-item:last-child {
      border-bottom: none;
    }

    .archive-item .info .title {
      font-size: 14px;
      font-weight: 600;
    }

    .archive-item .info .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .archive-item .time {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    #archive-close {
      float: right;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      margin-top: -4px;
    }

    #archive-empty {
      color: var(--text-muted);
      font-size: 14px;
    }

    #archive-clear-btn {
      display: block;
      margin: -8px 0 16px auto;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition);
    }

    #archive-clear-btn:hover {
      color: #ef4444;
      border-color: #ef4444;
    }

    .archive-item-remove {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      margin-left: 10px;
      transition: color var(--transition), background var(--transition);
    }

    .archive-item-remove:hover {
      color: #ef4444;
      background: var(--surface2);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .mode-icon {
      font-size: 13px;
    }

    body.resizing {
      user-select: none;
      cursor: col-resize;
    }

    @media (max-width: 640px) {
      :root {
        --topbar-h: 52px;
        --card-w: 240px;
      }

      #main {
        flex-direction: column;
      }

      #event-area {
        flex: 0 0 auto;
        height: 62%;
        padding: 20px 0 12px 16px;
        overflow: hidden;
      }

      #leave-by .time {
        font-size: 36px;
      }

      #leave-by {
        margin-bottom: 16px;
        padding-right: 16px;
      }

      #ribbon-label {
        padding-right: 16px;
      }

      #ribbon {
        padding-right: 16px;
      }

      #archive-btn {
        position: static;
        background: none;
        border: none;
        padding-right: 16px;
        padding-top: 12px;
        border-radius: 0;
        align-self: flex-start;
      }

      #resize-handle {
        display: none;
      }

      #map-panel {
        flex: 1;
        width: 100% !important;
        max-width: 100%;
        min-width: 0;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      #map-label {
        display: none;
      }

      #create-btn,
      #theme-toggle {
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      }

      #create-btn {
        left: 16px;
        padding: 10px 16px;
        font-size: 13px;
      }

      #theme-toggle {
        right: 16px;
        width: 40px;
        height: 40px;
        font-size: 16px;
      }

      #modal {
        padding: 24px;
        border-radius: 16px;
      }

      .field-row {
        flex-direction: column;
        gap: 0;
      }

      .card-actions {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

<div id="topbar">
  <div id="logo">Day<span>Go</span></div>
  <div id="weather-widget">
    <span class="emoji" id="weather-emoji">—</span>
    <span id="weather-temp">—</span>
  </div>
</div>

<div id="main">
  <div id="event-area">
    <div id="leave-by" class="hidden">
      <div class="label">Leave by</div>
      <div class="time" id="leave-time">—</div>
      <div class="event-name" id="leave-event-name"></div>
    </div>
    <div id="ribbon-label">Today's events</div>
    <div id="ribbon">
      <div class="spinner"></div>
    </div>
    <div id="empty-state">
      <div class="big">📭</div>
      <p>Nothing coming up. Add an event to get started.</p>
    </div>
    <button id="archive-btn" onclick="openArchive()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 3h18v4H3zM5 7v14h14V7" />
        <line x1="10" y1="11" x2="14" y2="11" />
      </svg>
      Past events
    </button>
  </div>
  <div id="resize-handle"></div>
  <div id="map-panel">
    <div id="map-label">Map</div>
    <div id="map"></div>
  </div>
</div>

<button id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
<button id="create-btn" onclick="openModal()">
  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <line x1="12" y1="5" x2="12" y2="19" />
    <line x1="5" y1="12" x2="19" y2="12" />
  </svg>
  New event
</button>

<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal">
    <h2 id="modal-title">New event</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="Doctor appointment">
    </div>
    <div class="field">
      <label>Destination</label>
      <input type="text" id="f-location" placeholder="Start typing an address…" autocomplete="off"
             oninput="onLocationInput(this.value)">
      <div id="autocomplete-results" style="display:none"></div>
    </div>
    <div class="field">
      <label>Date (leave blank for today)</label>
      <input type="date" id="f-date">
    </div>
    <div class="field-row">
      <div class="field"><label>Start time</label><input type="time" id="f-start"></div>
      <div class="field"><label>End time (optional)</label><input type="time" id="f-end"></div>
    </div>
    <div class="field">
      <label>Transport</label>
      <select id="f-mode">
        <option value="CAR">🚗 Car</option>
        <option value="TRANSIT">🚌 Transit</option>
        <option value="WALK">🚶 Walk</option>
        <option value="BIKE">🚲 Bike</option>
      </select>
    </div>
    <div class="field">
      <label>Description (optional)</label>
      <textarea id="f-description" placeholder="Any notes about this event…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-submit" onclick="submitEvent()">Add event</button>
    </div>
  </div>
</div>

<div id="archive-overlay" onclick="closeArchive()"></div>
<div id="archive-drawer">
  <button id="archive-close" onclick="closeArchive()">✕</button>
  <h2>Past events</h2>
  <button id="archive-clear-btn" onclick="clearAllPastEvents()">Clear all</button>
  <div id="archive-list"></div>
</div>

<script>
  const API = 'http://carolyn-unpainted.tun.ply.gg:52080';
  const MAPBOX_TOKEN = 'pk.eyJ1Ijoic3VwZXJmMWNpYWwiLCJhIjoiY211ajBicjdzMDAwbTJ3b213cXl0NTVxbyJ9.huWv0NEx-7EOvFz7dRTamg';
  mapboxgl.accessToken = MAPBOX_TOKEN;

  let map, userCoords = null;
  let allEvents = [], autocompleteTimeout = null;
  let selectedLocation = null;
  let editingEventId = null;

  let eventMarkers = [];
  let userMarker = null;
  let routeLayerIds = [];

  const EVENT_COLORS = [
    '#f59e0b', '#a855f7', '#ec4899', '#14b8a6', '#f97316', '#6366f1',
  ];

  const isMobile = () => window.innerWidth <= 640;

  window.addEventListener('DOMContentLoaded', () => {
    initMap();
    initResize();
    loadWeather();
    loadEvents();
    setInterval(loadEvents, 30000);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      loadEvents();
    }
  });

  function initMap() {
    map = new mapboxgl.Map({
      container: 'map',
      style: document.documentElement.dataset.theme === 'dark'
        ? 'mapbox://styles/mapbox/dark-v11'
        : 'mapbox://styles/mapbox/light-v11',
      zoom: 13,
      center: [-80.37273943621044, 25.756197299149566]
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
    map.on('load', () => { initUserLocation(); map.resize(); });
  }

  function initUserLocation() {
    const cached = sessionStorage.getItem('lastCoords');
    if (cached) {
      userCoords = JSON.parse(cached);
      map.flyTo({ center: userCoords, zoom: 13 });
      userMarker = new mapboxgl.Marker({ color: '#3b82f6' }).setLngLat(userCoords).addTo(map);
    }

    getUserCoordsAsync().then(coords => {
      userCoords = coords;
      map.flyTo({ center: coords, zoom: 13 });
      if (userMarker) userMarker.remove();
      userMarker = new mapboxgl.Marker({ color: '#3b82f6' }).setLngLat(coords).addTo(map);
    });
  }

  function setMapTheme(theme) {
    if (!map) return;
    map.setStyle(theme === 'dark'
      ? 'mapbox://styles/mapbox/dark-v11'
      : 'mapbox://styles/mapbox/light-v11');
    map.once('style.load', () => drawAllRoutes(allEvents.filter(e => e.status === 'upcoming' || e.status === 'active')));
  }

  function clearEventOverlays() {
    eventMarkers.forEach(m => m.remove());
    eventMarkers = [];
    routeLayerIds.forEach(id => {
      if (map.getLayer(id)) map.removeLayer(id);
      if (map.getSource(id)) map.removeSource(id);
    });
    routeLayerIds = [];
  }

  async function drawAllRoutes(upcoming) {
    if (!map.isStyleLoaded()) {
      map.once('style.load', () => drawAllRoutes(upcoming));
      return;
    }

    clearEventOverlays();
    if (!upcoming.length) return;

    const geocoded = await Promise.all(upcoming.map(async (e, i) => {
      try {
        const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(e.location)}.json?access_token=${MAPBOX_TOKEN}&limit=1`);
        const data = await res.json();
        if (!data.features.length) return null;
        return { coords: data.features[0].center, color: EVENT_COLORS[i % EVENT_COLORS.length], event: e };
      } catch { return null; }
    }));

    const valid = geocoded.filter(Boolean);
    if (!valid.length) return;

    valid.forEach(({ coords, color }) => {
      const marker = new mapboxgl.Marker({ color }).setLngLat(coords).addTo(map);
      eventMarkers.push(marker);
    });

    const waypoints = userCoords ? [userCoords, ...valid.map(v => v.coords)] : valid.map(v => v.coords);
    if (waypoints.length < 2) return;

    try {
      const coordStr = waypoints.map(c => c.join(',')).join(';');
      const res = await fetch(
        `https://api.mapbox.com/directions/v5/mapbox/driving/${coordStr}?geometries=geojson&overview=full&steps=true&access_token=${MAPBOX_TOKEN}`
      );
      const data = await res.json();
      if (!data.routes?.length) return;

      const legs = data.routes[0].legs;
      // draw in reverse order so earlier legs end up added last → rendered on top
      [...legs].reverse().forEach((leg, reverseIndex) => {
        const i = legs.length - 1 - reverseIndex; // original leg index
        const colorIdx = userCoords ? i : i + 1;
        const color = valid[Math.min(colorIdx, valid.length - 1)].color;
        const layerId = `route-leg-${i}`;

        if (map.getLayer(layerId)) { map.removeLayer(layerId); map.removeSource(layerId); }
        map.addSource(layerId, {
          type: 'geojson', data: {
            type: 'Feature', geometry: leg.steps.reduce((acc, s) => {
              acc.coordinates.push(...s.geometry.coordinates);
              return acc;
            }, { type: 'LineString', coordinates: [] })
          }
        });
        map.addLayer({
          id: layerId, type: 'line', source: layerId,
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': color, 'line-width': 4, 'line-opacity': 0.85 }
        });
        routeLayerIds.push(layerId);
      });

      const bounds = new mapboxgl.LngLatBounds();
      waypoints.forEach(c => bounds.extend(c));
      const padding = isMobile() ? { top: 20, bottom: 60, left: 20, right: 20 } : 40;
      map.fitBounds(bounds, { padding });
    } catch (e) { console.warn('Route failed:', e); }
  }

  function initResize() {
    const handle = document.getElementById('resize-handle');
    const panel = document.getElementById('map-panel');
    let dragging = false, startX = 0, startW = 0;

    // restore saved width on load
    const savedWidth = localStorage.getItem('mapPanelWidth');
    if (savedWidth && !isMobile()) {
      const w = Math.min(Math.max(parseInt(savedWidth, 10), 200), window.innerWidth * 0.6);
      panel.style.width = w + 'px';
    }

    handle.addEventListener('mousedown', e => {
      if (isMobile()) return;
      dragging = true; startX = e.clientX; startW = panel.offsetWidth;
      handle.classList.add('dragging');
      document.body.classList.add('resizing');
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const newW = Math.min(Math.max(startW + (startX - e.clientX), 200), window.innerWidth * 0.6);
      panel.style.width = newW + 'px';
      map.resize();
      syncArchiveDrawerWidth();
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.classList.remove('resizing');
      localStorage.setItem('mapPanelWidth', panel.offsetWidth);
    });
  }

  async function loadWeather() {
    try {
      const coords = await getUserCoordsAsync();
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords[1]}&longitude=${coords[0]}&current=temperature_2m,weathercode&temperature_unit=fahrenheit&timezone=auto`);
      const data = await res.json();
      document.getElementById('weather-temp').textContent = `${Math.round(data.current.temperature_2m)}°F`;
      document.getElementById('weather-emoji').textContent = weatherEmoji(data.current.weathercode);
    } catch (e) { console.warn('Weather failed:', e); }
  }

  function getUserCoordsAsync() {
    return new Promise(resolve => {
      // instant fallback: last known coords from this session, if any
      const cached = sessionStorage.getItem('lastCoords');
      const fallback = cached ? JSON.parse(cached) : [-80.4117, 25.9234];

      if (!navigator.geolocation) { resolve(fallback); return; }

      navigator.geolocation.getCurrentPosition(
        p => {
          const coords = [p.coords.longitude, p.coords.latitude];
          sessionStorage.setItem('lastCoords', JSON.stringify(coords));
          resolve(coords);
        },
        () => resolve(fallback),
        { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
      );
    });
  }

  function waitForUserCoords(timeoutMs = 8000) {
    return new Promise(resolve => {
      const start = Date.now();
      (function check() {
        if (userCoords || Date.now() - start > timeoutMs) return resolve();
        setTimeout(check, 150);
      })();
    });
  }

  function weatherEmoji(code) {
    if (code === 0) return '☀️';
    if (code <= 2) return '⛅';
    if (code <= 3) return '☁️';
    if (code <= 48) return '🌫️';
    if (code <= 67) return '🌧️';
    if (code <= 77) return '❄️';
    if (code <= 82) return '🌦️';
    if (code <= 99) return '⛈️';
    return '🌡️';
  }

  function formatTime12(t, withZone = false) {
    if (!t) return t;
    const [h, m] = t.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    const base = `${h12}:${String(m).padStart(2, '0')} ${period}`;
    return withZone ? `${base} EST` : base;
  }

  async function loadEvents() {
    try {
      const res = await fetch(`${API}/api/events`);
      allEvents = await res.json();
      renderEvents();
    } catch (e) {
      document.getElementById('ribbon').innerHTML = '<p style="color:var(--text-muted);font-size:13px">Could not reach server.</p>';
    }
  }

  function renderEvents() {
    const toDateTime = e => (e.date || new Date().toISOString().slice(0, 10)) + 'T' + e.startTime;
    const toMinutes = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

    const upcoming = allEvents
      .filter(e => e.status === 'upcoming' || e.status === 'active')
      .sort((a, b) => toDateTime(a).localeCompare(toDateTime(b)));

    const past = allEvents.filter(e => e.status === 'past')
      .sort((a, b) => toMinutes(b.startTime) - toMinutes(a.startTime));

    const ribbon = document.getElementById('ribbon');
    const emptyState = document.getElementById('empty-state');
    const leaveBy = document.getElementById('leave-by');

    if (upcoming.length === 0) {
      ribbon.innerHTML = '';
      ribbon.style.display = 'none';
      emptyState.style.display = 'flex';
      leaveBy.classList.add('hidden');
      clearEventOverlays();
    } else {
      ribbon.style.display = 'flex';
      emptyState.style.display = 'none';
      ribbon.innerHTML = upcoming.map((e, i) => buildCard(e, i)).join('');
      fetchLeaveBy(upcoming[0]);
      waitForUserCoords().then(() => drawAllRoutes(upcoming));
    }

    renderArchive(past);
  }

  async function fetchLeaveBy(event) {
    try {
      const res = await fetch(`${API}/api/events/${event.id}/plan`, { method: 'POST' });
      const data = await res.json();
      document.getElementById('leave-time').textContent = data.departureTime ? formatTime12(data.departureTime, true) : '—';
      document.getElementById('leave-event-name').textContent = `for ${event.title}`;
      document.getElementById('leave-by').classList.remove('hidden');
    } catch (e) {
      document.getElementById('leave-by').classList.add('hidden');
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function buildCard(event, index) {
    const isActive = event.status === 'active';
    const color = EVENT_COLORS[index % EVENT_COLORS.length];
    const modeIcon = { CAR: '🚗', TRANSIT: '🚌', WALK: '🚶', BIKE: '🚲' }[event.mode] || '🚗';
    const endPart = event.endTime ? `–${formatTime12(event.endTime)}` : '';
    const today = new Date().toISOString().slice(0, 10);
    const dateLabel = event.date && event.date !== today
      ? new Date(event.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      : 'Today';
    const id = event.id;
    const descriptionHtml = event.description
      ? `<div class="card-description">${escapeHtml(event.description)}</div>`
      : '';
    return `
    <div class="event-card ${isActive ? 'active-card' : ''}" style="border-color: ${color}33;">
      <div class="card-accent-bar" style="background: ${color};"></div>
      <div class="card-actions">
        <button class="card-action-btn" onclick="openEditModal('${id}')" title="Edit">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="card-action-btn delete" onclick="deleteEvent('${id}')" title="Delete">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
      <div class="card-status" style="color: ${color};">${isActive ? 'Active' : 'Upcoming'} · ${dateLabel}</div>
      <div class="card-title">${event.title}</div>
      <div class="card-time">${formatTime12(event.startTime)}${endPart}</div>
      <div class="card-divider"></div>
      <a class="card-location" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(event.location)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        ${event.location}
      </a>
      ${descriptionHtml}
      <div class="card-mode"><span class="mode-icon">${modeIcon}</span> ${event.mode}</div>
      <div class="card-dot" style="background: ${color};"></div>
    </div>`;
  }

  function renderArchive(past) {
    const list = document.getElementById('archive-list');
    const clearBtn = document.getElementById('archive-clear-btn');
    if (past.length === 0) {
      list.innerHTML = '<p id="archive-empty">No past events yet.</p>';
      clearBtn.style.display = 'none';
      return;
    }
    clearBtn.style.display = 'block';
    list.innerHTML = past.map(e => `
  <div class="archive-item">
    <div class="info">
      <div class="title">${e.title}</div>
      <div class="meta">${e.location}</div>
    </div>
    <div class="time">${formatTime12(e.startTime)}</div>
    <button class="archive-item-remove" onclick="deletePastEvent('${e.id}')" title="Remove">✕</button>
  </div>`).join('');
  }

  async function deletePastEvent(id) {
    try {
      await fetch(`${API}/api/events/${id}`, { method: 'DELETE' });
      loadEvents();
    } catch (e) { alert('Failed to remove event.'); }
  }

  async function clearAllPastEvents() {
    const past = allEvents.filter(e => e.status === 'past');
    if (!past.length) return;
    if (!confirm(`Delete all ${past.length} past events?`)) return;
    try {
      await Promise.all(past.map(e => fetch(`${API}/api/events/${e.id}`, { method: 'DELETE' })));
      loadEvents();
    } catch (e) { alert('Failed to clear past events.'); }
  }

  async function deleteEvent(id) {
    if (!confirm('Delete this event?')) return;
    try {
      await fetch(`${API}/api/events/${id}`, { method: 'DELETE' });
      loadEvents();
    } catch (e) { alert('Failed to delete event.'); }
  }

  function openModal() {
    editingEventId = null;
    document.getElementById('modal-title').textContent = 'New event';
    document.getElementById('modal-submit').textContent = 'Add event';
    clearModalFields();
    document.getElementById('modal-overlay').classList.add('open');
  }

  function openEditModal(id) {
    const event = allEvents.find(e => e.id === id);
    if (!event) return;
    editingEventId = id;
    document.getElementById('modal-title').textContent = 'Edit event';
    document.getElementById('modal-submit').textContent = 'Save changes';
    document.getElementById('f-title').value = event.title || '';
    document.getElementById('f-location').value = event.location || '';
    document.getElementById('f-date').value = event.date || '';
    document.getElementById('f-start').value = event.startTime || '';
    document.getElementById('f-end').value = event.endTime || '';
    document.getElementById('f-mode').value = event.mode || 'CAR';
    document.getElementById('f-description').value = event.description || '';
    selectedLocation = null;
    document.getElementById('autocomplete-results').style.display = 'none';
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('autocomplete-results').style.display = 'none';
    selectedLocation = null;
    editingEventId = null;
  }

  function clearModalFields() {
    ['f-title', 'f-location', 'f-start', 'f-end', 'f-date', 'f-description'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-mode').value = 'CAR';
    selectedLocation = null;
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  async function submitEvent() {
    const title = document.getElementById('f-title').value.trim();
    const location = selectedLocation ? selectedLocation.name : document.getElementById('f-location').value.trim();
    const date = document.getElementById('f-date').value || null;
    const startTime = document.getElementById('f-start').value;
    const endTime = document.getElementById('f-end').value || null;
    const mode = document.getElementById('f-mode').value;
    const description = document.getElementById('f-description').value.trim() || null;

    if (!title || !location || !startTime) { alert('Title, destination, and start time are required.'); return; }

    try {
      if (editingEventId) {
        await fetch(`${API}/api/events/${editingEventId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, location, date, startTime, endTime, mode, description })
        });
      } else {
        await fetch(`${API}/api/events`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, location, date, startTime, endTime, mode, description })
        });
      }
      closeModal();
      loadEvents();
    } catch (e) { alert('Failed to save event. Is the server running?'); }
  }

  function onLocationInput(val) {
    clearTimeout(autocompleteTimeout);
    if (val.length < 3) { document.getElementById('autocomplete-results').style.display = 'none'; return; }
    autocompleteTimeout = setTimeout(() => fetchAutocomplete(val), 300);
  }

  async function fetchAutocomplete(query) {
    try {
      const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_TOKEN}&autocomplete=true&limit=5&country=us`);
      showAutocomplete((await res.json()).features);
    } catch (e) { }
  }

  function showAutocomplete(features) {
    const box = document.getElementById('autocomplete-results');
    if (!features.length) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.innerHTML = features.map(f => `
    <div class="autocomplete-item" onclick="selectLocation('${f.place_name.replace(/'/g, "\\'")}', ${f.center[0]}, ${f.center[1]})">
      ${f.place_name}
    </div>`).join('');
  }

  function selectLocation(name, lng, lat) {
    selectedLocation = { name, coords: [lng, lat] };
    document.getElementById('f-location').value = name;
    document.getElementById('autocomplete-results').style.display = 'none';
  }

  function openArchive() {
    syncArchiveDrawerWidth();
    document.getElementById('archive-overlay').classList.add('open');
  }

  function syncArchiveDrawerWidth() {
    const drawer = document.getElementById('archive-drawer');
    if (isMobile()) {
      drawer.style.width = '';
    } else {
      const eventArea = document.getElementById('event-area');
      drawer.style.width = eventArea.getBoundingClientRect().width + 'px';
    }
  }

  window.addEventListener('resize', syncArchiveDrawerWidth);
  function closeArchive() { document.getElementById('archive-overlay').classList.remove('open'); }

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = next;
    document.getElementById('theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
    setMapTheme(next);
  }
</script>
</body>

</html>
